<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RDP</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #101014;
    color: #d8d8de;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  /*
   * Компонент сам держит канвас и сам решает, как его показать. Растягивать
   * его в CSS нельзя: именно так картинка сервера и оказывалась натянутой на
   * панель. Здесь задаётся только место, которое он занимает.
   */
  #session, #session > iron-remote-desktop {
    display: block;
    width: 100%;
    height: 100%;
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    white-space: pre-wrap;
    background: #101014;
  }
  #status.error { color: #ff8080; }
</style>
</head>
<body>
  <!--
    Сам <iron-remote-desktop> создаётся в boot.js, а не стоит здесь.
    Причина в порядке выполнения: статические импорты выполняются раньше тела
    модуля, поэтому элемент из разметки успевает подняться и разослать своё
    событие ready до того, как страница на него подпишется. Проверено —
    подписка не срабатывала вовсе.
  -->
  <div id="session"></div>
  <div id="status">Connecting…</div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
