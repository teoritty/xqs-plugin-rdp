<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RDP</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #101014;
    color: #d8d8de;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #screen {
    display: block;
    width: 100%;
    height: 100%;
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    white-space: pre-wrap;
  }
  #status.error { color: #ff8080; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="status">Connecting…</div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
